name: CI/CD Pipeline

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab once billing is resolved
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Ingestion Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Data Ingestion
        run: |
          python backend/ingest.py

      - name: Execute Pytest Suite
        run: |
          python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Next.js 14 App
        working-directory: frontend
        run: npm run build

  predator007-build:
    name: Predator007 3D World Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: predator007/package-lock.json

      - name: Install Predator007 Dependencies
        working-directory: predator007
        run: npm ci

      - name: Build Predator007 App
        working-directory: predator007
        run: npm run build
